name: Roomy
options:
  bundleIdPrefix: com.roomyapp.ios
targets:
  Roomy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Roomy
        excludes:
          - Resources/AppIcon-src
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.roomyapp.ios
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      INFOPLIST_KEY_CFBundleDisplayName: Roomy
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Roomy/Info.plist
      properties:
        CFBundleDisplayName: Roomy
        NSPhotoLibraryUsageDescription: "Roomy needs access to your photos and videos to find what's taking up space and shrink it. Everything is processed on your phone."
        NSPhotoLibraryAddUsageDescription: "Roomy saves compressed copies to your photo library."
        BGTaskSchedulerPermittedIdentifiers:
          - com.roomyapp.ios.refresh
        UIBackgroundModes:
          - fetch
          - processing
